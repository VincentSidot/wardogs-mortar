name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true cree le site Pages s'il n'existe pas encore,
      # ce qui evite d'avoir a l'activer a la main dans les reglages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # On ne publie que la page : les sources Python restent dans le depot
      # mais ne sont pas servies par le site.
      - name: Preparer le site
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
