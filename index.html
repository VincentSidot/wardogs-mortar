<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calcul artillerie</title>
<style>
  :root{
    --bg:#0f110c;
    --panel:#181b13;
    --panel-2:#1f2318;
    --panel-3:#262b1c;
    --line:#31371f;
    --line-soft:#262b1a;
    --ink:#e9ebda;
    --dim:#8d9478;
    --dimmer:#666c55;
    --accent:#c9d64f;
    --accent-dim:#8d9a2e;
    --hot:#e2703a;
    --ok:#7fb069;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
    --r:7px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    background-image:radial-gradient(1200px 600px at 50% -10%,#1b2015 0%,#0f110c 70%);
    min-height:100vh;
  }

  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:rgba(15,17,12,.85);position:sticky;top:0;z-index:20;
  }
  h1{margin:0;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
     font-weight:700;white-space:nowrap}
  h1 .sep{color:var(--dimmer);margin:0 8px}
  h1 .sub{color:var(--ink);font-weight:400;letter-spacing:.12em}
  header .spacer{flex:1}
  header .meta{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em}

  main{max-width:1240px;margin:0 auto;padding:18px 22px 60px;
       display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0}
  @media(max-width:940px){
    main{grid-template-columns:1fr}
    .col-side{order:-1}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .panel.tight{padding:12px 14px}
  .panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .panel-head h2{margin:0;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
                 color:var(--dim);font-weight:600}
  .panel-head .spacer{flex:1}

  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--dim);margin-bottom:5px;font-weight:600}
  input,select{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
        color:var(--ink);font-family:var(--mono);font-size:17px;padding:9px 11px;width:104px;
        transition:border-color .12s}
  select{font-size:13px;width:auto;min-width:110px;padding:11px 9px}
  input::placeholder{color:var(--dimmer)}
  input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--panel-3)}
  input.wide{width:150px}
  input.small{font-size:14px;padding:7px 9px;width:86px}

  button{background:var(--accent);color:#15170f;border:0;border-radius:5px;
         font:700 11px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;
         padding:12px 16px;cursor:pointer;transition:filter .12s}
  button:hover{filter:brightness(1.12)}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button.ghost:hover{color:var(--ink);border-color:var(--dim);filter:none}
  button.small{padding:8px 11px;font-size:10px}
  button.danger:hover{color:var(--hot);border-color:var(--hot)}
  .icon-btn{background:none;border:0;color:var(--dimmer);cursor:pointer;font-size:15px;
            padding:2px 6px;letter-spacing:0}
  .icon-btn:hover{color:var(--hot);filter:none}

  .hint{color:var(--dim);font-size:11.5px;margin:10px 0 0;line-height:1.55}
  .hint code{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:3px;
             padding:1px 5px;font-size:11px;color:var(--ink)}
  .err{color:var(--hot);font-size:11.5px;margin-top:8px}
  .err:empty{display:none}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tab{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;
       padding:7px 8px 7px 14px;display:flex;align-items:center;gap:6px;cursor:pointer;
       font-size:12px;color:var(--dim);transition:all .12s;white-space:nowrap}
  .tab:hover{border-color:var(--dim);color:var(--ink)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#15170f;font-weight:600}
  .tab.on .icon-btn{color:#4a4f22}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--dimmer);flex:none}
  .tab.on .dot{background:#15170f}
  .tab .dot.fired{background:var(--hot)}

  .sol-grid{display:grid;gap:10px}
  .sol{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
       padding:12px 14px;display:grid;grid-template-columns:1fr auto auto;gap:14px;
       align-items:center;cursor:pointer}
  .sol.on{border-color:var(--accent-dim);background:var(--panel-3)}
  .sol .who{min-width:0}
  .sol .who .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sol .who .co{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .sol .fig{text-align:right}
  .sol .fig .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .sol .fig .v{font-family:var(--mono);font-size:27px;line-height:1.15;color:var(--accent);
               font-variant-numeric:tabular-nums}
  .sol .fig .v .u{font-size:13px;color:var(--dim)}
  .sol .fig .s{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .sol .warn{grid-column:1/-1;color:var(--hot);font-size:11.5px;border-top:1px solid var(--line);
             padding-top:8px}
  .sol .corr{grid-column:1/-1;color:var(--ok);font-size:11px;font-family:var(--mono)}
  .sol .note{grid-column:1/-1;color:var(--dim);font-size:11.5px;border-top:1px solid var(--line);
             padding-top:8px}
  @media(max-width:560px){.sol{grid-template-columns:1fr 1fr}.sol .who{grid-column:1/-1}}

  .list{display:flex;flex-direction:column;gap:6px}
  .item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;
        background:var(--panel-2);border:1px solid transparent;cursor:pointer;transition:all .12s}
  .item:hover{border-color:var(--line)}
  .item.on{border-color:var(--accent-dim);background:var(--panel-3)}
  .item .nm{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .co{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .swatch{width:10px;height:10px;border-radius:2px;flex:none}

  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  th{text-align:left;font:600 9.5px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;
     color:var(--dim);padding:0 8px 8px 0}
  td{padding:7px 8px 7px 0;border-top:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
  .empty{color:var(--dimmer);font-size:11.5px;padding:10px 0}

  .chip{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 7px;
        border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .chip.hot{color:var(--hot);border-color:#4a2a18}
  .chip.ok{color:var(--ok);border-color:#2e4526}

  .plot{display:block;width:100%;height:auto;background:var(--panel-2);
        border:1px solid var(--line);border-radius:var(--r)}
  .compass{display:block;margin:0 auto;max-width:100%}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:10.5px;color:var(--dim)}
  .legend span{display:flex;align-items:center;gap:5px}

  details.fold summary{cursor:pointer;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
                       color:var(--dim);font-weight:600;list-style:none}
  details.fold summary::-webkit-details-marker{display:none}
  details.fold summary::before{content:"\25B8  ";color:var(--dimmer)}
  details.fold[open] summary::before{content:"\25BE  "}
  details.fold[open] summary{margin-bottom:12px}
</style>
</head>
<body>

<header>
  <h1><span data-i18n="brand">Wardogs</span><span class="sep">/</span><span class="sub" data-i18n="appTitle">Calcul artillerie</span></h1>
  <span class="spacer"></span>
  <span class="meta" data-i18n="subtitle">1 pt = 100 m</span>
  <button id="lang" class="ghost small">EN</button>
</header>

<main>
  <div class="col col-main">

    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="missionsSection">Missions de tir</h2>
        <span class="spacer"></span>
        <button id="newMission" class="ghost small" data-i18n="newMission">Nouvelle</button>
      </div>
      <div class="tabs" id="missionTabs"></div>
      <div class="empty" id="noMissions" data-i18n="noMissions">Aucune mission.</div>

      <div id="missionBody">
        <div class="row" style="margin-top:14px">
          <div><label for="mn" data-i18n="missionName">Nom</label>
               <input id="mn" class="wide"></div>
          <div class="f-x"><label for="mx" data-i18n="targetX">Cible X</label>
               <input id="mx" inputmode="decimal" placeholder="102.3"></div>
          <div class="f-y"><label for="my" data-i18n="targetY">Cible Y</label>
               <input id="my" inputmode="decimal" placeholder="62.1"></div>
          <button id="delMission" class="ghost small danger f-end" data-i18n="deleteMission">Supprimer</button>
        </div>
        <p class="hint" id="pasteHint"></p>
      </div>
    </section>

    <section class="panel" id="solPanel">
      <div class="panel-head">
        <h2 data-i18n="solutionsSection">Solutions de tir</h2>
        <span class="spacer"></span>
        <span class="chip" id="aimChip"></span>
      </div>
      <div class="sol-grid" id="solutions"></div>
    </section>

    <section class="panel" id="shotPanel">
      <div class="panel-head">
        <h2 data-i18n="shotsSection">Impacts observés</h2>
        <span class="spacer"></span>
        <button id="undoShot" class="ghost small" data-i18n="undoShot">Annuler le dernier</button>
      </div>
      <div class="row">
        <div class="f-x"><label for="ix" data-i18n="impactX">Impact X</label>
             <input id="ix" inputmode="decimal" placeholder="74.83"></div>
        <div class="f-y"><label for="iy" data-i18n="impactY">Impact Y</label>
             <input id="iy" inputmode="decimal" placeholder="74.78"></div>
        <div class="f-end"><label for="ib" data-i18n="firedBy">Tirée par</label>
             <select id="ib"></select></div>
        <button id="logShot" class="f-end" data-i18n="logShot">Enregistrer</button>
      </div>
      <div class="err" id="shotErr"></div>
      <table style="margin-top:12px">
        <thead><tr>
          <th data-i18n="thNo">#</th>
          <th data-i18n="thBattery">Batterie</th>
          <th data-i18n="thImpact">Impact</th>
          <th data-i18n="thMiss">Écart</th>
          <th></th>
        </tr></thead>
        <tbody id="shotRows"></tbody>
      </table>
      <div class="empty" id="noShots" data-i18n="noShots">Aucun impact enregistré.</div>
      <p class="hint" data-i18n-html="shotsHint"></p>
      <p class="hint" data-i18n-html="noiseHint"></p>
    </section>

    <section class="panel">
      <details class="fold">
        <summary data-i18n="reverseSection">Mode inverse</summary>
        <div class="row">
          <div><label for="pb" data-i18n="fromBattery">Depuis</label><select id="pb"></select></div>
          <div><label for="pd" data-i18n="distanceM">Distance (m)</label>
               <input id="pd" class="small" inputmode="decimal" placeholder="1900"></div>
          <div><label for="pa" data-i18n="azimuthDeg">Azimut (°)</label>
               <input id="pa" class="small" inputmode="decimal" placeholder="353"></div>
          <button id="project" data-i18n="whereBtn">Où ça tombe ?</button>
        </div>
        <div id="projectOut"></div>
        <p class="hint" data-i18n-html="reverseHint"></p>
      </details>
    </section>
  </div>

  <div class="col col-side">

    <section class="panel">
      <div class="panel-head"><h2 data-i18n="batteriesSection">Batteries</h2></div>
      <div class="list" id="batteryList"></div>
      <div class="empty" id="noBatteries" data-i18n="noBatteries">Aucune batterie.</div>
      <div class="row" style="margin-top:12px">
        <div class="f-x"><label for="bx">X</label><input id="bx" class="small" inputmode="decimal" placeholder="96.45"></div>
        <div class="f-y"><label for="by">Y</label><input id="by" class="small" inputmode="decimal" placeholder="109.35"></div>
        <div class="f-end"><label for="bn" data-i18n="nameLabel">Nom</label><input id="bn" class="small"></div>
        <button id="addBattery" class="small f-end" data-i18n="addBattery">Ajouter</button>
      </div>
      <div class="err" id="batteryErr"></div>
    </section>

    <section class="panel tight">
      <div class="panel-head"><h2 data-i18n="mapSection">Vue tactique</h2></div>
      <svg class="plot" id="plot" viewBox="0 0 300 300"></svg>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel tight">
      <div class="panel-head"><h2 data-i18n="compassSection">Rose des vents</h2></div>
      <svg class="compass" id="compass" viewBox="0 0 220 220" width="220" height="220"></svg>
    </section>

    <section class="panel">
      <details class="fold">
        <summary data-i18n="settingsSection">Réglages</summary>
        <div class="row">
          <div><label for="scale" data-i18n="metresPerPoint">Mètres / point</label>
               <input id="scale" class="small" inputmode="decimal" value="100"></div>
          <div><label for="order" data-i18n="inputOrder">Ordre de saisie</label>
               <button id="order" class="ghost small" style="padding:9px 11px">X puis Y</button></div>
          <div><label for="curve" data-i18n="curveLabel">Offset terrain</label>
               <button id="curve" class="ghost small" style="padding:9px 11px">OFF</button></div>
        </div>
        <p class="hint" data-i18n-html="calibHint"></p>
      </details>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

/* ============================================================ i18n ==== */
const I18N = {
  fr: {

    onGround: m => m + ' m on the ground',
    belowStep:'correction below dial step',
    ballistic: m => 'correction ' + m + ' m',
    perDegree: m => '1° = ' + m + ' m',
    aimNoCorr:'No correction', aimCorr: n => n + (n > 1 ? ' corrections' : ' correction'),
    errBatteryFirst:'Add a battery first.',
    errCoords:'Invalid coordinates.',
    errNoMission:'Set the target first.',
    errRangeAzimuth:'Range and azimuth required.',
    aimedPoint:'Aim point',
    fromTarget: m => m + ' m from target',
    farWarning:'Offset over 1.5 km: this is probably not drift but a misread coordinate. ' +
      'Double-check before correcting.',
    legBattery:'Battery', legTarget:'Target', legAim:'Aim', legImpact:'Impact',
    deleteTitle:'Delete'
  }
};
function T(){ return I18N[state.lang === 'en' ? 'en' : 'fr']; }

/* ====================================================== persistance ==== */
const KEY = 'artillerie';
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } },
  save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
};

function defaultLang(){
  try { return String(navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en'; }
  catch (e) { return 'fr'; }
}
let seq = 0;
const uid = p => p + Date.now().toString(36) + (seq++).toString(36) + Math.random().toString(36).slice(2, 5);

// L'ancien format n'avait qu'une piece et une liste de cibles : on le convertit
// plutot que de le jeter, pour ne pas perdre ce qui etait deja saisi.
function migrate(raw){
  if (!raw || raw.batteries || !raw.gun) return raw || {};
  const out = { lang: raw.lang, scale: raw.scale, yFirst: raw.yFirst, batteries: [], missions: [] };
  const gx = parseFloat(raw.gun.x), gy = parseFloat(raw.gun.y);
  if (Number.isFinite(gx) && Number.isFinite(gy)) {
    out.batteries.push({ id: uid('b'), name: 'Alpha', x: gx, y: gy });
  }
  (raw.targets || []).forEach((t, i) => {
    out.missions.push({ id: uid('m'), name: t.label || ('Mission ' + (i + 1)),
                        x: t.x, y: t.y, shots: [] });
  });
  out.activeBatteryId = out.batteries.length ? out.batteries[0].id : null;
  out.activeMissionId = out.missions.length ? out.missions[0].id : null;
  return out;
}

const state = Object.assign({
  lang: defaultLang(), scale: 100, yFirst: false, terrainCurve: false,
  batteries: [], missions: [], activeBatteryId: null, activeMissionId: null
}, migrate(store.load()));

// Les impacts enregistres avant la correction amortie n'ont pas de point vise.
// On le reconstitue avec l'ancienne regle cumulative, pour ne rien perdre.
state.missions.forEach(m => {
  const seen = {};
  m.shots.forEach(s => {
    if (s.aimX !== undefined && s.aimY !== undefined) return;
    const acc = seen[s.batteryId] || (seen[s.batteryId] = { x: m.x, y: m.y });
    s.aimX = acc.x;
    s.aimY = acc.y;
    acc.x += m.x - s.x;
    acc.y += m.y - s.y;
  });
});
function persist(){ store.save(state); }
persist();


/* ========================================================== moteur ==== */
function cardinalIndex(az){ return Math.round(((az % 360) + 360) % 360 / 22.5) % 16; }

// X croit vers l'est, Y vers le nord. Azimut 0 = nord, sens horaire.
function solve(from, to, mppv){
  const dE = (to.x - from.x) * mppv;
  const dN = (to.y - from.y) * mppv;
  const distance = Math.hypot(dE, dN);
  const azimuth = ((Math.atan2(dE, dN) * 180 / Math.PI) % 360 + 360) % 360;
  return { distance_m: distance, distance_pts: distance / mppv,
           azimuth_deg: azimuth, azimuth_mils: azimuth * 6400 / 360,
           d_east_m: dE, d_north_m: dN, cardinal_idx: cardinalIndex(azimuth) };
}

function project(from, distance_m, azimuth_deg, mppv){
  const r = distance_m / mppv, a = azimuth_deg * Math.PI / 180;
  return { x: from.x + r * Math.sin(a), y: from.y + r * Math.cos(a), distance_pts: r };
}

// Offset terrain mesure sur 12 coups le 05/09 depuis x96/y109 vers le sud
// (voir calibrate.py). Les tables du jeu supposent gun et cible a la meme
// altitude ; ce qu'on a mesure est tres probablement la pente, pas le canon.
// Donc : optionnel, et desactive par defaut.
const RANGE_CALIBRATION = [[800, 1.0013], [1400, 1.0123], [2000, 1.0155], [2600, 1.0388]];

// Enveloppe du SPH-2 d'apres les mesures communautaires (wardogshub) :
// arc haut seul sous 1181 m, bascule de l'arc vers 2625 m.
const SPH2 = { minRange: 780, lowArcFrom: 1181, maxRange: 2629, nearMaxFrom: 2550 };
const DISPERSION_MOA = 10;
const dispersionM = groundM => groundM * (DISPERSION_MOA / 60) * Math.PI / 180;

function rangeStatus(groundM){
  if (groundM < SPH2.minRange) return 'tooClose';
  if (groundM > SPH2.maxRange) return 'outOfRange';
  if (groundM > SPH2.nearMaxFrom) return 'nearMax';
  if (groundM < SPH2.lowArcFrom) return 'highArcOnly';
  return 'ok';
}

function dialRange(groundM){
  const t = RANGE_CALIBRATION;
  if (groundM <= t[0][0]) return groundM * t[0][1];
  if (groundM >= t[t.length - 1][0]) return groundM * t[t.length - 1][1];
  for (let i = 0; i < t.length - 1; i++) {
    const r0 = t[i][0], f0 = t[i][1], r1 = t[i + 1][0], f1 = t[i + 1][1];
    if (groundM >= r0 && groundM <= r1) {
      return groundM * (f0 + (groundM - r0) / (r1 - r0) * (f1 - f0));
    }
  }
  return groundM;
}

// Resolution de reglage : azimut au degre, portee par crans d'environ 25 m.
const DIAL_AZIMUTH_STEP_DEG = 1;
const DIAL_RANGE_STEP_M = 25;

function dialable(groundM, azimuthDeg, useCurve){
  const exact = useCurve ? dialRange(groundM) : groundM;
  return {
    range_dialed: Math.round(exact / DIAL_RANGE_STEP_M) * DIAL_RANGE_STEP_M,
    range_exact: exact,
    azimuth_dialed: ((Math.round(azimuthDeg / DIAL_AZIMUTH_STEP_DEG) * DIAL_AZIMUTH_STEP_DEG) % 360 + 360) % 360,
    azimuth_step_m: (DIAL_AZIMUTH_STEP_DEG / 2) * Math.PI / 180 * groundM,
    correction_below_step: Math.abs(exact - groundM) < DIAL_RANGE_STEP_M / 2
  };
}

/* ================================================ modele de mission ==== */
const mpp = () => num($('scale')) || 100;
const battery = id => state.batteries.find(b => b.id === id) || null;
const mission = () => state.missions.find(m => m.id === state.activeMissionId) || null;
const missionReady = m => !!m && m.x !== null && m.y !== null &&
                          Number.isFinite(m.x) && Number.isFinite(m.y);

// Reglage amorti : le biais de la piece est estime par la moyenne des ecarts
// (impact - point vise) de ses tirs, et la visee vaut cible - biais. Un seul
// impact corrige a fond ; plusieurs se lissent au lieu de faire osciller la
// visee au rythme de la dispersion. Le compte est propre a chaque batterie.
function aimFor(m, batteryId){
  let bx = 0, by = 0, n = 0;
  for (let i = 0; i < m.shots.length; i++) {
    const s = m.shots[i];
    if (s.batteryId !== batteryId) continue;
    bx += s.x - s.aimX;
    by += s.y - s.aimY;
    n++;
  }
  if (!n) return { x: m.x, y: m.y };
  return { x: m.x - bx / n, y: m.y - by / n };
}
const shotsOf = (m, bid) => m.shots.filter(s => s.batteryId === bid);

/* ========================================================= saisie ===== */
function num(el){
  const v = parseFloat(String(el.value).replace(',', '.'));
  return Number.isFinite(v) ? v : null;
}
const yFirst = () => !!state.yFirst;

function splitPaste(changed, xField, yField){
  const src = changed.value.trim();
  if (!src) return;
  const lx = src.match(/x\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i);
  const ly = src.match(/y\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/i);
  if (lx && ly) {
    xField.value = lx[1].replace(',', '.');
    yField.value = ly[1].replace(',', '.');
    return;
  }
  const m = src.split(/[\s,;/|]+/).filter(v => v !== '');
  if (m.length === 2) {
    const first = yFirst() ? yField : xField;
    const second = yFirst() ? xField : yField;
    first.value = m[0];
    second.value = m[1];
  }
}
function pairFields(xid, yid, after){
  [xid, yid].forEach(id => $(id).addEventListener('change', e => {
    splitPaste(e.target, $(xid), $(yid));
    if (after) after();
  }));
}

function applyOrder(){
  const on = yFirst();
  document.querySelectorAll('.f-y').forEach(el => { el.style.order = on ? 0 : 1; });
  document.querySelectorAll('.f-x').forEach(el => { el.style.order = on ? 1 : 0; });
  document.querySelectorAll('.f-end').forEach(el => { el.style.order = 2; });
  $('order').textContent = on ? T().orderYX : T().orderXY;
  $('pasteHint').innerHTML = T().pasteHint(on ? '60.2 100.4' : '100.4 60.2');
}

function fmt(n, d){
  d = d || 0;
  return Number(n).toLocaleString(T().locale, { minimumFractionDigits: d, maximumFractionDigits: d });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* ======================================================= batteries ==== */
const SWATCHES = ['#c9d64f', '#5fa8d3', '#e2703a', '#7fb069', '#b98ad6', '#d6b85a'];
function swatchOf(id){
  const i = state.batteries.findIndex(b => b.id === id);
  return SWATCHES[(i < 0 ? 0 : i) % SWATCHES.length];
}

function addBattery(){
  const x = num($('bx')), y = num($('by'));
  if (x === null || y === null) { $('batteryErr').textContent = T().errCoords; return; }
  $('batteryErr').textContent = '';
  const name = $('bn').value.trim() || (T().batteryPlaceholder + (state.batteries.length + 1));
  const b = { id: uid('b'), name: name, x: x, y: y };
  state.batteries.push(b);
  state.activeBatteryId = b.id;
  $('bx').value = ''; $('by').value = ''; $('bn').value = '';
  persist(); render();
}

function renderBatteries(){
  const list = $('batteryList');
  list.innerHTML = '';
  $('noBatteries').style.display = state.batteries.length ? 'none' : 'block';

  state.batteries.forEach(b => {
    const el = document.createElement('div');
    el.className = 'item' + (b.id === state.activeBatteryId ? ' on' : '');
    el.innerHTML =
      '<span class="swatch" style="background:' + swatchOf(b.id) + '"></span>' +
      '<span class="nm">' + esc(b.name) + '</span>' +
      '<span class="co">' + fmt(b.x, 2) + ' / ' + fmt(b.y, 2) + '</span>' +
      '<button class="icon-btn" title="' + T().deleteTitle + '">×</button>';
    el.addEventListener('click', e => {
      if (e.target.classList.contains('icon-btn')) {
        state.batteries = state.batteries.filter(v => v.id !== b.id);
        state.missions.forEach(m => { m.shots = m.shots.filter(s => s.batteryId !== b.id); });
        if (state.activeBatteryId === b.id) {
          state.activeBatteryId = state.batteries.length ? state.batteries[0].id : null;
        }
      } else {
        state.activeBatteryId = b.id;
      }
      persist(); render();
    });
    list.appendChild(el);
  });

  ['ib', 'pb'].forEach(id => {
    const sel = $(id), keep = sel.value;
    sel.innerHTML = state.batteries
      .map(b => '<option value="' + b.id + '">' + esc(b.name) + '</option>').join('');
    sel.value = state.batteries.some(b => b.id === keep) ? keep : (state.activeBatteryId || '');
  });
}

/* ======================================================== missions ==== */
function newMission(){
  const m = { id: uid('m'), name: T().defaultMission + (state.missions.length + 1),
              x: null, y: null, shots: [] };
  state.missions.push(m);
  state.activeMissionId = m.id;
  persist(); render();
  $(yFirst() ? 'my' : 'mx').focus();
}

function renderMissionTabs(){
  const tabs = $('missionTabs');
  tabs.innerHTML = '';
  $('noMissions').style.display = state.missions.length ? 'none' : 'block';
  $('missionBody').hidden = !state.missions.length;

  state.missions.forEach(m => {
    const el = document.createElement('div');
    el.className = 'tab' + (m.id === state.activeMissionId ? ' on' : '');
    el.innerHTML = '<span class="dot' + (m.shots.length ? ' fired' : '') + '"></span>' +
                   '<span>' + esc(m.name) + '</span>' +
                   '<button class="icon-btn" title="' + T().deleteTitle + '">×</button>';
    el.addEventListener('click', e => {
      if (e.target.classList.contains('icon-btn')) {
        state.missions = state.missions.filter(v => v.id !== m.id);
        if (state.activeMissionId === m.id) {
          state.activeMissionId = state.missions.length ? state.missions[0].id : null;
        }
      } else {
        state.activeMissionId = m.id;
      }
      persist(); render();
    });
    tabs.appendChild(el);
  });
}

function readMissionFields(){
  const m = mission();
  if (!m) return;
  const n = $('mn').value.trim();
  if (n) m.name = n;
  m.x = num($('mx'));
  m.y = num($('my'));
  persist(); render();
}

/* ======================================================= solutions ==== */
function renderSolutions(){
  const m = mission();
  const ready = missionReady(m) && state.batteries.length > 0;
  $('solPanel').hidden = !ready;
  $('shotPanel').hidden = !ready;
  if (!ready) return;

  const box = $('solutions');
  box.innerHTML = '';
  const scale = mpp();

  state.batteries.forEach(b => {
    const aim = aimFor(m, b.id);
    const n = shotsOf(m, b.id).length;
    const s = solve(b, aim, scale);
    const d = dialable(s.distance_m, s.azimuth_deg, state.terrainCurve);
    const status = rangeStatus(s.distance_m);
    const statusLine =
      status === 'tooClose'    ? '<div class="warn">' + T().tooClose(fmt(SPH2.minRange)) + '</div>' :
      status === 'outOfRange'  ? '<div class="warn">' + T().outOfRange(fmt(SPH2.maxRange)) + '</div>' :
      status === 'nearMax'     ? '<div class="warn">' + T().nearMax(fmt(SPH2.maxRange)) + '</div>' :
      status === 'highArcOnly' ? '<div class="note">' + T().highArcOnly(fmt(SPH2.lowArcFrom)) + '</div>' : '';

    const el = document.createElement('div');
    el.className = 'sol' + (b.id === state.activeBatteryId ? ' on' : '');
    el.innerHTML =
      '<div class="who">' +
        '<div class="nm"><span class="swatch" style="background:' + swatchOf(b.id) +
          ';display:inline-block;margin-right:7px"></span>' + esc(b.name) + '</div>' +
        '<div class="co">' + fmt(b.x, 2) + ' / ' + fmt(b.y, 2) + '</div>' +
      '</div>' +
      '<div class="fig">' +
        '<div class="k">' + T().rangeToDial + '</div>' +
        '<div class="v">' + fmt(d.range_dialed) + '<span class="u"> m</span></div>' +
        '<div class="s">' + T().onGround(fmt(s.distance_m)) + ' · ' + T().dispersion(fmt(dispersionM(s.distance_m))) +
          (state.terrainCurve && !d.correction_below_step
            ? ' · ' + T().ballistic((d.range_exact >= s.distance_m ? '+' : '') +
                                    fmt(d.range_exact - s.distance_m))
            : '') + '</div>' +
      '</div>' +
      '<div class="fig">' +
        '<div class="k">' + T().azimuthToDial + '</div>' +
        '<div class="v">' + fmt(d.azimuth_dialed) + '<span class="u">°</span></div>' +
        '<div class="s">' + T().cardinals[s.cardinal_idx] + ' · ' +
          T().perDegree(fmt(d.azimuth_step_m * 2)) + '</div>' +
      '</div>' +
      (n ? '<div class="corr">' + T().corrLine(n, fmt(aim.x, 2), fmt(aim.y, 2)) + '</div>' : '') +
      statusLine;

    el.addEventListener('click', () => {
      state.activeBatteryId = b.id;
      persist(); render();
    });
    box.appendChild(el);
  });

  const total = m.shots.length;
  $('aimChip').textContent = total ? T().aimCorr(total) : T().aimNoCorr;
  $('aimChip').className = 'chip' + (total ? ' ok' : '');
}

/* ==================================================== journal de tir === */
function logShot(){
  const m = mission();
  const x = num($('ix')), y = num($('iy'));
  const bid = $('ib').value;
  if (!missionReady(m)) { $('shotErr').textContent = T().errNoMission; return; }
  if (!bid) { $('shotErr').textContent = T().errBatteryFirst; return; }
  if (x === null || y === null) { $('shotErr').textContent = T().errCoords; return; }
  $('shotErr').textContent = '';
  // On memorise le point vise au moment du tir : c'est lui, pas la cible,
  // qui sert de reference pour mesurer l'ecart de la piece.
  const aim = aimFor(m, bid);
  m.shots.push({ id: uid('s'), batteryId: bid, x: x, y: y, aimX: aim.x, aimY: aim.y });
  $('ix').value = ''; $('iy').value = '';
  persist(); render();
}

function renderShots(){
  const m = mission();
  const body = $('shotRows');
  body.innerHTML = '';
  if (!m) return;
  $('noShots').style.display = m.shots.length ? 'none' : 'block';
  $('undoShot').style.display = m.shots.length ? '' : 'none';

  const scale = mpp();
  m.shots.forEach((s, i) => {
    // Ecart mesure par rapport au point vise pour ce tir, dans la convention
    // de l'artilleur : direction ou l'obus est tombe.
    const off = solve({ x: s.aimX, y: s.aimY }, { x: s.x, y: s.y }, scale);
    const b = battery(s.batteryId);
    const far = off.distance_m > 1500;
    const range = solve(b || { x: s.aimX, y: s.aimY }, { x: s.aimX, y: s.aimY }, scale).distance_m;
    const noise = dispersionM(range) + DIAL_RANGE_STEP_M / 2 +
                  (DIAL_AZIMUTH_STEP_DEG / 2) * Math.PI / 180 * range;
    const inNoise = off.distance_m <= noise;
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + (i + 1) + '</td>' +
      '<td>' + (b ? esc(b.name) : '—') + '</td>' +
      '<td>' + fmt(s.x, 2) + ' / ' + fmt(s.y, 2) + '</td>' +
      '<td><span class="chip' + (far ? ' hot' : inNoise ? '' : ' ok') + '">' + fmt(off.distance_m) + ' m ' +
        T().cardinals[off.cardinal_idx] + (inNoise ? ' · ' + T().inNoise : '') + '</span></td>' +
      '<td style="text-align:right"><button class="icon-btn" title="' + T().deleteTitle + '">×</button></td>';
    tr.querySelector('.icon-btn').addEventListener('click', () => {
      m.shots = m.shots.filter(v => v.id !== s.id);
      persist(); render();
    });
    body.appendChild(tr);
  });

  const last = m.shots[m.shots.length - 1];
  if (last) {
    const off = solve({ x: last.aimX, y: last.aimY }, { x: last.x, y: last.y }, scale);
    $('shotErr').textContent = off.distance_m > 1500 ? T().farWarning : '';
  }
}

/* ==================================================== vue tactique ==== */
function renderPlot(){
  const m = mission();
  const svg = $('plot');
  const pts = [];
  state.batteries.forEach(b => pts.push({ x: b.x, y: b.y, kind: 'b', id: b.id, name: b.name }));
  if (missionReady(m)) {
    pts.push({ x: m.x, y: m.y, kind: 't' });
    state.batteries.forEach(b => {
      if (shotsOf(m, b.id).length) {
        const a = aimFor(m, b.id);
        pts.push({ x: a.x, y: a.y, kind: 'a', id: b.id });
      }
    });
    m.shots.forEach(s => pts.push({ x: s.x, y: s.y, kind: 'i', id: s.batteryId }));
  }

  if (!pts.length) { svg.innerHTML = ''; $('legend').innerHTML = ''; return; }

  const W = 300, H = 300, pad = 26;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const span = Math.max(Math.max.apply(null, xs) - Math.min.apply(null, xs),
                        Math.max.apply(null, ys) - Math.min.apply(null, ys), 2) * 1.3;
  const cx = (Math.max.apply(null, xs) + Math.min.apply(null, xs)) / 2;
  const cy = (Math.max.apply(null, ys) + Math.min.apply(null, ys)) / 2;
  const x0 = cx - span / 2, x1 = cx + span / 2;
  const y0 = cy - span / 2, y1 = cy + span / 2;

  const px = x => pad + (x - x0) / (x1 - x0) * (W - 2 * pad);
  const py = y => H - pad - (y - y0) / (y1 - y0) * (H - 2 * pad);

  const g = [];
  const step = span > 40 ? 10 : span > 16 ? 5 : 1;
  for (let v = Math.ceil(x0 / step) * step; v <= x1; v += step) {
    g.push('<line x1="' + px(v) + '" y1="' + pad + '" x2="' + px(v) + '" y2="' + (H - pad) +
           '" stroke="#262b1a"/>');
  }
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) {
    g.push('<line x1="' + pad + '" y1="' + py(v) + '" x2="' + (W - pad) + '" y2="' + py(v) +
           '" stroke="#262b1a"/>');
  }
  g.push('<text x="' + (W - pad) + '" y="' + (pad - 9) + '" fill="#666c55" font-size="9" ' +
         'font-family="monospace" text-anchor="end">N ↑</text>');

  if (missionReady(m)) {
    state.batteries.forEach(b => {
      const a = aimFor(m, b.id);
      g.push('<line x1="' + px(b.x) + '" y1="' + py(b.y) + '" x2="' + px(a.x) + '" y2="' + py(a.y) +
             '" stroke="' + swatchOf(b.id) + '" stroke-width="1" stroke-opacity="' +
             (b.id === state.activeBatteryId ? '.75' : '.25') + '"/>');
    });
  }

  pts.forEach(p => {
    const X = px(p.x), Y = py(p.y), c = p.kind === 't' ? '#e9ebda' : swatchOf(p.id);
    if (p.kind === 'b') {
      g.push('<rect x="' + (X - 4.5) + '" y="' + (Y - 4.5) + '" width="9" height="9" rx="1.5" fill="' + c + '"/>');
      g.push('<text x="' + X + '" y="' + (Y - 8) + '" fill="' + c + '" font-size="8.5" ' +
             'font-family="monospace" text-anchor="middle">' + esc(p.name) + '</text>');
    } else if (p.kind === 't') {
      g.push('<circle cx="' + X + '" cy="' + Y + '" r="6" fill="none" stroke="#e9ebda" stroke-width="1.5"/>');
      g.push('<line x1="' + (X - 9) + '" y1="' + Y + '" x2="' + (X + 9) + '" y2="' + Y + '" stroke="#e9ebda"/>');
      g.push('<line x1="' + X + '" y1="' + (Y - 9) + '" x2="' + X + '" y2="' + (Y + 9) + '" stroke="#e9ebda"/>');
    } else if (p.kind === 'a') {
      g.push('<path d="M' + X + ' ' + (Y - 5) + 'L' + (X + 5) + ' ' + Y + 'L' + X + ' ' + (Y + 5) +
             'L' + (X - 5) + ' ' + Y + 'Z" fill="none" stroke="' + c + '" stroke-width="1.5"/>');
    } else {
      g.push('<line x1="' + (X - 3.5) + '" y1="' + (Y - 3.5) + '" x2="' + (X + 3.5) + '" y2="' + (Y + 3.5) +
             '" stroke="' + c + '" stroke-width="1.5" stroke-opacity=".8"/>');
      g.push('<line x1="' + (X + 3.5) + '" y1="' + (Y - 3.5) + '" x2="' + (X - 3.5) + '" y2="' + (Y + 3.5) +
             '" stroke="' + c + '" stroke-width="1.5" stroke-opacity=".8"/>');
    }
  });

  svg.innerHTML = g.join('');
  $('legend').innerHTML =
    '<span><svg width="10" height="10"><rect width="9" height="9" rx="1.5" fill="#8d9478"/></svg>' +
      T().legBattery + '</span>' +
    '<span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="none" stroke="#e9ebda"/></svg>' +
      T().legTarget + '</span>' +
    '<span><svg width="10" height="10"><path d="M5 1L9 5L5 9L1 5Z" fill="none" stroke="#8d9478"/></svg>' +
      T().legAim + '</span>' +
    '<span><svg width="10" height="10"><line x1="1.5" y1="1.5" x2="8.5" y2="8.5" stroke="#8d9478"/>' +
      '<line x1="8.5" y1="1.5" x2="1.5" y2="8.5" stroke="#8d9478"/></svg>' + T().legImpact + '</span>';
}

/* ==================================================== rose des vents === */
function renderCompass(){
  const m = mission();
  const b = battery(state.activeBatteryId);
  const c = 110, R = 88, g = [
    '<circle cx="' + c + '" cy="' + c + '" r="' + R + '" fill="#1f2318" stroke="#31371f"/>',
    '<circle cx="' + c + '" cy="' + c + '" r="' + (R * 0.55) + '" fill="none" stroke="#262b1a"/>'
  ];
  for (let a = 0; a < 360; a += 15) {
    const long = a % 45 === 0, r1 = R - (long ? 11 : 5), rad = (a - 90) * Math.PI / 180;
    g.push('<line x1="' + (c + r1 * Math.cos(rad)) + '" y1="' + (c + r1 * Math.sin(rad)) +
           '" x2="' + (c + R * Math.cos(rad)) + '" y2="' + (c + R * Math.sin(rad)) +
           '" stroke="' + (long ? '#5c6544' : '#3a4029') + '"/>');
  }
  [0, 90, 180, 270].forEach((a, i) => {
    const rad = (a - 90) * Math.PI / 180, rr = R - 24;
    g.push('<text x="' + (c + rr * Math.cos(rad)) + '" y="' + (c + rr * Math.sin(rad) + 4) +
           '" fill="#8d9478" font-size="11" font-family="monospace" text-anchor="middle">' +
           T().compassPoints[i] + '</text>');
  });

  if (b && missionReady(m)) {
    const s = solve(b, aimFor(m, b.id), mpp());
    const rad = (s.azimuth_deg - 90) * Math.PI / 180;
    g.push('<line x1="' + c + '" y1="' + c + '" x2="' + (c + (R - 8) * Math.cos(rad)) +
           '" y2="' + (c + (R - 8) * Math.sin(rad)) + '" stroke="' + swatchOf(b.id) + '" stroke-width="2"/>');
    g.push('<text x="' + c + '" y="' + (c + 40) + '" fill="' + swatchOf(b.id) + '" font-size="15" ' +
           'font-family="monospace" text-anchor="middle">' + fmt(s.azimuth_deg, 1) + '°</text>');
    g.push('<text x="' + c + '" y="' + (c + 56) + '" fill="#8d9478" font-size="10" ' +
           'font-family="monospace" text-anchor="middle">' + esc(b.name) + '</text>');
  }
  g.push('<circle cx="' + c + '" cy="' + c + '" r="4" fill="#c9d64f"/>');
  $('compass').innerHTML = g.join('');
}

/* ==================================================== mode inverse ==== */
function runProject(){
  const out = $('projectOut');
  const d = num($('pd')), a = num($('pa'));
  const b = battery($('pb').value);
  if (!b) { out.innerHTML = '<div class="err">' + T().errBatteryFirst + '</div>'; return; }
  if (d === null || a === null) { out.innerHTML = '<div class="err">' + T().errRangeAzimuth + '</div>'; return; }

  const p = project(b, d, a, mpp());
  const m = mission();
  let gap = '';
  if (missionReady(m)) {
    gap = ' · ' + T().fromTarget(fmt(Math.hypot(p.x - m.x, p.y - m.y) * mpp()));
  }
  out.innerHTML = '<div class="sol" style="margin-top:12px;cursor:default"><div class="who">' +
    '<div class="nm">' + T().aimedPoint + '</div>' +
    '<div class="co">' + esc(b.name) + '</div></div>' +
    '<div class="fig" style="grid-column:2/-1">' +
      '<div class="v">x ' + fmt(p.x, 2) + '<span class="u"> / </span>y ' + fmt(p.y, 2) + '</div>' +
      '<div class="s">' + fmt(p.distance_pts, 2) + ' pt' + gap + '</div></div></div>';
}

/* ========================================================== rendu ===== */
function render(){
  $('curve').textContent = state.terrainCurve ? T().curveOn : T().curveOff;
  $('curve').style.color = state.terrainCurve ? 'var(--accent)' : '';
  $('curve').style.borderColor = state.terrainCurve ? 'var(--accent-dim)' : '';
  renderBatteries();
  renderMissionTabs();

  const m = mission();
  if (m) {
    if (document.activeElement !== $('mn')) $('mn').value = m.name;
    if (document.activeElement !== $('mx')) $('mx').value = m.x === null ? '' : m.x;
    if (document.activeElement !== $('my')) $('my').value = m.y === null ? '' : m.y;
  }
  $('mn').placeholder = T().missionPlaceholder;
  $('bn').placeholder = T().batteryPlaceholder + (state.batteries.length + 1);

  renderSolutions();
  renderShots();
  renderPlot();
  renderCompass();
}

function applyLang(){
  const d = T();
  document.documentElement.lang = d.htmlLang;
  document.title = d.appTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = d[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = d[el.dataset.i18nHtml]; });
  $('lang').textContent = d.other;
  applyOrder();
  render();
}

/* ======================================================= branchement == */
pairFields('bx', 'by');
pairFields('mx', 'my', readMissionFields);
pairFields('ix', 'iy');

$('addBattery').addEventListener('click', addBattery);
['bx', 'by', 'bn'].forEach(id => $(id).addEventListener('keydown', e => {
  if (e.key === 'Enter') addBattery();
}));

$('newMission').addEventListener('click', newMission);
$('delMission').addEventListener('click', () => {
  const m = mission();
  if (!m) return;
  state.missions = state.missions.filter(v => v.id !== m.id);
  state.activeMissionId = state.missions.length ? state.missions[0].id : null;
  persist(); render();
});
['mn', 'mx', 'my'].forEach(id => $(id).addEventListener('input', readMissionFields));

$('logShot').addEventListener('click', logShot);
['ix', 'iy'].forEach(id => $(id).addEventListener('keydown', e => {
  if (e.key === 'Enter') logShot();
}));
$('undoShot').addEventListener('click', () => {
  const m = mission();
  if (!m || !m.shots.length) return;
  m.shots.pop();
  persist(); render();
});
$('ib').addEventListener('change', () => {
  state.activeBatteryId = $('ib').value;
  persist(); render();
});

$('project').addEventListener('click', runProject);
['pd', 'pa'].forEach(id => $(id).addEventListener('keydown', e => {
  if (e.key === 'Enter') runProject();
}));

$('scale').addEventListener('input', () => { state.scale = $('scale').value; persist(); render(); });
$('order').addEventListener('click', () => {
  state.yFirst = !state.yFirst;
  persist(); applyOrder();
});
$('curve').addEventListener('click', () => {
  state.terrainCurve = !state.terrainCurve;
  persist(); render();
});
$('lang').addEventListener('click', () => {
  state.lang = state.lang === 'en' ? 'fr' : 'en';
  persist(); applyLang();
});

$('scale').value = state.scale || 100;
if (!state.activeBatteryId && state.batteries.length) state.activeBatteryId = state.batteries[0].id;
if (!state.activeMissionId && state.missions.length) state.activeMissionId = state.missions[0].id;
applyLang();
</script>
</body>
</html>
